    training_change: Five intent classes; 4 epochs; learning rate 2e-5; exported as INT8 ONNX
    historical_result: accuracy 1.000 / macro-F1 1.000 on the old 600-row split
    historical_limitation: Old train/validation/test splits contain duplicate and cross-split overlaps.
